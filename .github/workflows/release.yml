name: Auto Release

on:
  push:
    branches: [main]
    paths:
      - "ZenLock-Android/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

# Serialize publication so two pushes cannot upload the same version concurrently.
concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # Merged contributions build on main; manual runs use repository permissions.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The checked-in Gradle version is the only source of release numbering.
      # This workflow never edits, increments, or commits version fields.
      - name: Read repository version
        id: version
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          from pathlib import Path

          gradle = Path("ZenLock-Android/app/build.gradle.kts").read_text()
          names = re.findall(r'^\s*versionName\s*=\s*"([^"\n]+)"\s*(?://.*)?$', gradle, re.MULTILINE)
          codes = re.findall(r'^\s*versionCode\s*=\s*(\d+)\s*(?://.*)?$', gradle, re.MULTILINE)
          if len(names) != 1 or len(codes) != 1:
              raise SystemExit("Expected one literal versionName and versionCode in app/build.gradle.kts")
          name, code = names[0], codes[0]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?", name) or int(code) < 1:
              raise SystemExit("Invalid repository versionName or versionCode")
          print(f"Building repository version {name} (code {code}) without modification")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version_name={name}\nversion_code={code}\nrelease_tag=v{name}\n")
          PYTHON

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: ZenLock-Android

      # Build both flavor variants as debug APKs (auto-signed with Android's
      # debug keystore so they install via sideload):
      #   - playstore flavor: no SMS permission (matches Play Store build)
      #   - sms flavor: SEND_SMS permission included (optional variant)
      - name: Build debug APKs (playstore + sms flavors)
        run: ./gradlew assemblePlaystoreDebug assembleSmsDebug -x lint
        working-directory: ZenLock-Android

      - name: Rename APKs
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          mkdir -p release-artifacts
          cp ZenLock-Android/app/build/outputs/apk/playstore/debug/app-playstore-debug.apk \
             "release-artifacts/zenlock-v${VERSION_NAME}-debug.apk"
          cp ZenLock-Android/app/build/outputs/apk/sms/debug/app-sms-debug.apk \
             "release-artifacts/zenlock-v${VERSION_NAME}-sms-debug.apk"

      - name: Save APKs for this workflow run
        uses: actions/upload-artifact@v7
        with:
          name: zenlock-v${{ steps.version.outputs.version_name }}-build-${{ steps.version.outputs.version_code }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/*.apk
          if-no-files-found: error
          compression-level: 0

      - name: Check whether this version is already published
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          STATUS=$(curl --silent --show-error \
            --output "$RUNNER_TEMP/zenlock-release.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          case "$STATUS" in
            200)
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "Release $RELEASE_TAG already exists; keeping it unchanged. New APKs are attached to this workflow run." >> "$GITHUB_STEP_SUMMARY"
              ;;
            404)
              if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1 && \
                 [ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" != "$GITHUB_SHA" ]; then
                echo "publish=false" >> "$GITHUB_OUTPUT"
                echo "Tag $RELEASE_TAG belongs to another commit; keeping it unchanged. New APKs are attached to this workflow run." >> "$GITHUB_STEP_SUMMARY"
              else
                echo "publish=true" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "::error::Could not check release $RELEASE_TAG (HTTP $STATUS). Refusing to overwrite a release."
              exit 1
              ;;
          esac

      # Changelog generation:
      # - Finds the previous version tag so we only include commits shipped in THIS release.
      # - Groups commits by Conventional Commit type into user-friendly sections.
      # - Strips the "type:" prefix from each line so the final output reads like a product changelog.
      # - Skips noise: "chore: bump version" commits, and "chore:" commits in general (internal tooling
      #   doesn't belong in user-facing release notes).
      # - Any commit not matching a recognized prefix is put under "Other changes".
      - name: Generate changelog
        if: steps.publication.outputs.publish == 'true'
        id: changelog
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          PREV_TAG=$(git tag --merged HEAD --sort=-version:refname --list 'v[0-9]*' | awk -v current="$RELEASE_TAG" '$0 != current { print; exit }')
          if [ -z "$PREV_TAG" ]; then
            RAW=$(git log --pretty=format:"%s" -n 50)
          else
            RAW=$(git log "$PREV_TAG"..HEAD --pretty=format:"%s" --invert-grep --grep="chore: bump version")
          fi

          FEATURES=""
          FIXES=""
          PERF=""
          DOCS=""
          REFACTOR=""
          OTHER=""

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            # Strip merge-commit wrapper like "Merge pull request #13 from ..." — keep PR references useful
            if echo "$line" | grep -qE "^Merge pull request"; then
              OTHER="${OTHER}- ${line}"$'\n'
              continue
            fi
            case "$line" in
              feat:*|feat\(*\):*)
                CLEAN=$(echo "$line" | sed -E 's/^feat(\([^)]+\))?:\s*//')
                FEATURES="${FEATURES}- ${CLEAN}"$'\n'
                ;;
              fix:*|fix\(*\):*)
                CLEAN=$(echo "$line" | sed -E 's/^fix(\([^)]+\))?:\s*//')
                FIXES="${FIXES}- ${CLEAN}"$'\n'
                ;;
              perf:*|perf\(*\):*)
                CLEAN=$(echo "$line" | sed -E 's/^perf(\([^)]+\))?:\s*//')
                PERF="${PERF}- ${CLEAN}"$'\n'
                ;;
              docs:*|docs\(*\):*)
                CLEAN=$(echo "$line" | sed -E 's/^docs(\([^)]+\))?:\s*//')
                DOCS="${DOCS}- ${CLEAN}"$'\n'
                ;;
              refactor:*|refactor\(*\):*)
                CLEAN=$(echo "$line" | sed -E 's/^refactor(\([^)]+\))?:\s*//')
                REFACTOR="${REFACTOR}- ${CLEAN}"$'\n'
                ;;
              chore:*|chore\(*\):*|test:*|test\(*\):*|style:*|ci:*|build:*)
                # Intentionally skipped from user-facing changelog
                ;;
              *)
                OTHER="${OTHER}- ${line}"$'\n'
                ;;
            esac
          done <<< "$RAW"

          CHANGELOG=""
          if [ -n "$FEATURES" ]; then
            CHANGELOG="${CHANGELOG}### New Features"$'\n'"${FEATURES}"$'\n'
          fi
          if [ -n "$FIXES" ]; then
            CHANGELOG="${CHANGELOG}### Bug Fixes"$'\n'"${FIXES}"$'\n'
          fi
          if [ -n "$PERF" ]; then
            CHANGELOG="${CHANGELOG}### Performance"$'\n'"${PERF}"$'\n'
          fi
          if [ -n "$REFACTOR" ]; then
            CHANGELOG="${CHANGELOG}### Refactors"$'\n'"${REFACTOR}"$'\n'
          fi
          if [ -n "$DOCS" ]; then
            CHANGELOG="${CHANGELOG}### Documentation"$'\n'"${DOCS}"$'\n'
          fi
          if [ -n "$OTHER" ]; then
            CHANGELOG="${CHANGELOG}### Other Changes"$'\n'"${OTHER}"$'\n'
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="No user-facing changes in this release."$'\n'
          fi

          {
            echo "changelog<<CHANGELOG_EOF"
            echo "$CHANGELOG"
            echo "CHANGELOG_EOF"
          } >> $GITHUB_OUTPUT

      # Create-only: unlike an update action, this cannot replace an existing release.
      - name: Create GitHub Release
        if: steps.publication.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          set -euo pipefail
          {
            printf "## What's new in v%s\n\n" "$VERSION_NAME"
            printf 'App version: **%s** · version code: **%s**\n' "$VERSION_NAME" "$VERSION_CODE"
            printf 'APK build source: `%s`\n\n' "$GITHUB_SHA"
            printf '%s\n\n' "$CHANGELOG"
            cat <<'NOTES'
          ---
          ### Downloads

          Two debug APKs are attached below (both auto-signed with Android's debug keystore so they install via sideload):

          - **`zenlock-vX.Y.Z-debug.apk`** — default build, matches the Play Store version (no SMS permission).
          - **`zenlock-vX.Y.Z-sms-debug.apk`** — same app with SMS accountability-partner support enabled.

          For the official release, install from [Google Play](https://play.google.com/store/apps/details?id=com.grepguru.zenlock).
          NOTES
          } > "$RUNNER_TEMP/zenlock-release-notes.md"
          gh release create "$RELEASE_TAG" release-artifacts/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ZenLock v$VERSION_NAME" \
            --notes-file "$RUNNER_TEMP/zenlock-release-notes.md"
